<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Login App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="dashboard-page">

    <!-- Top navigation bar -->
    <header class="top-bar">
      <div class="logo">
        <div class="logo-mark">L</div>
        <span class="logo-name">LoginApp</span>
      </div>
      <button class="btn-logout" id="logout-btn">Sign out</button>
    </header>

    <!-- Main content -->
    <main class="dashboard-body">
      <div class="welcome-card">
        <div class="avatar" id="avatar">?</div>
        <h1>Hello, <span id="username">…</span></h1>
        <p class="subtitle">You're securely signed in. Here's your account summary.</p>

        <div class="meta">
          <div class="meta-row">
            <span class="key">User ID</span>
            <span class="value" id="user-id">—</span>
          </div>
          <div class="meta-row">
            <span class="key">Email</span>
            <span class="value" id="user-email">—</span>
          </div>
          <div class="meta-row">
            <span class="key">Member since</span>
            <span class="value" id="user-since">—</span>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Verify authentication immediately; redirect to login if not authenticated
    (async () => {
      const res = await fetch('/api/auth/me');
      if (!res.ok) {
        window.location.replace('/login.html');
        return;
      }

      const { user } = await res.json();

      document.getElementById('username').textContent   = user.username;
      document.getElementById('user-id').textContent    = `#${user.id}`;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('avatar').textContent     = user.username[0].toUpperCase();

      // Format the created_at date
      if (user.created_at) {
        const date = new Date(user.created_at);
        document.getElementById('user-since').textContent = date.toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric',
        });
      }
    })();

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const result = await apiPost('/api/auth/logout', {});
      if (result.success) {
        window.location.replace('/login.html');
      }
    });
  </script>
</body>
</html>
